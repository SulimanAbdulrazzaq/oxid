name: s20-verify
on: push
env:
  CARGO_TERM_COLOR: always
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: rustc --version && cargo clippy --version
      - run: cargo clippy --all-targets -- -D warnings
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release 2>&1 | tail -40
  audit-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - name: audit as committed (informational)
        run: |
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0049 > audit-before.txt 2>&1 || true
          grep -c '^ID:' audit-before.txt || true
          tail -3 audit-before.txt
      - name: audit after cargo update (informational)
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          cargo update
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0049 > audit-after.txt 2>&1 || true
          echo "--- remaining after a full cargo update:"
          grep -E '^(Crate|Version|ID|Solution):' audit-after.txt | paste - - - - | sort -u
          tail -3 audit-after.txt
